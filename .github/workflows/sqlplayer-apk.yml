name: SQLplayer APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: sqlplayer-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SQLplayer release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Configure FOSS build
        run: |
          printf '\nisFullBuild=false\n' >> gradle.properties
          touch local.properties

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Show APK files
        if: always()
        run: find androidApp/build/outputs/apk -type f -name '*.apk' -print || true

      - name: Upload unsigned/release APK
        uses: actions/upload-artifact@v4
        with:
          name: SQLplayer-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
